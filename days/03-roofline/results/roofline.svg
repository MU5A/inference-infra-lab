<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580" role="img" aria-label="Roofline chart: attainable FLOP per second against FLOP per byte">
<style>:root{--bg:#ffffff;--fg:#24292f;--grid:#d8dee4}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--grid:#30363d}}text{fill:var(--fg);font:12px system-ui,sans-serif}.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--fg);stroke-width:1.2}.roof{fill:none;stroke-width:2}</style>
